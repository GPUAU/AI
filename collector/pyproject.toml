[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-collector"
version = "0.1.0"
description = "GPU 공개 가격 수집·적재 (ERD 스키마)"
requires-python = ">=3.12"
# 호환 범위만 적는다. Airflow 이미지에는 Airflow constraints로 설치해 Airflow가 검증한 버전에 맞춘다(airflow/Dockerfile).
dependencies = [
    "psycopg[binary]>=3.2.10,<4",
    "ijson>=3.3,<4",
    "requests>=2.32.3,<3",
]

[project.optional-dependencies]
power = ["openpyxl>=3.1.5,<4"]
dev = [
    "pytest==8.3.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gpu_collector = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
