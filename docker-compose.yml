# 로컬 개발용 PostgreSQL. 로컬 전용 계정이며 외부에 열지 않는다(127.0.0.1 바인딩).
# 맥에 이미 설치된 PostgreSQL(기본 5432)과 겹치지 않도록 5435 포트를 쓴다.
services:
  db:
    image: postgres:17
    container_name: gpuau-ai-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gpu_erd
      TZ: UTC
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - gpuau_ai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gpu_erd"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  gpuau_ai_pgdata:
