# dag-processor: 이미지 안 DAG 파일(/opt/airflow/dags)을 읽어 메타 DB에 등록한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-dag-processor
  namespace: u1-3
  labels:
    app: airflow
    component: dag-processor
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: airflow
      component: dag-processor
  template:
    metadata:
      labels:
        app: airflow
        component: dag-processor
    spec:
      serviceAccountName: s3-access
      securityContext:
        runAsNonRoot: true
        runAsUser: 50000
        fsGroup: 0
      initContainers:
        # DB 테이블 준비(db migrate)는 scheduler만 한다. 끝날 때까지 기다린 뒤 시작한다
        - name: wait-migrations
          image: IMAGE_PLACEHOLDER
          command: ["bash", "-c"]
          args: ["airflow db check-migrations --migration-wait-timeout 600"]
          envFrom:
            - configMapRef: {name: airflow-config}
            - secretRef: {name: airflow-secrets}
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: rds-credentials, key: DATABASE_URL}}
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: "$(DATABASE_URL)&options=-csearch_path%3Dairflow"
          resources:                         # 확인만 해서 작게(파드 쿼터는 initContainer와 본 컨테이너 중 큰 값)
            requests: {cpu: 50m, memory: 256Mi}
            limits: {cpu: 150m, memory: 512Mi}
      containers:
        - name: dag-processor
          image: IMAGE_PLACEHOLDER
          args: ["dag-processor"]
          envFrom:
            - configMapRef: {name: airflow-config}
            - secretRef: {name: airflow-secrets}
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: rds-credentials, key: DATABASE_URL}}
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: "$(DATABASE_URL)&options=-csearch_path%3Dairflow"
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {cpu: 150m, memory: 512Mi}
          volumeMounts:
            - {name: logs, mountPath: /opt/airflow/logs}
      volumes:
        - name: logs
          emptyDir: {sizeLimit: 1Gi}
