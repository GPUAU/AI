apiVersion: batch/v1
kind: CronJob
metadata:
  name: collector
  namespace: u1-3
  labels:
    app: collector
spec:
  # 매일 12:30 KST (수출입은행 환율은 영업일 11시 전후 고시)
  schedule: "30 12 * * *"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app: collector
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
          containers:
            - name: collector
              image: IMAGE_PLACEHOLDER
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: rds-credentials
                      key: DATABASE_URL
              # AWS_ACCESS_KEY_ID · AWS_SECRET_ACCESS_KEY · KOREAEXIM_API_KEY · HYPERSTACK_API_KEY
              # 팀 포털에서 Secret 'ai-collector-keys' 생성 신청. 없으면 해당 수집기만 건너뛴다.
              envFrom:
                - secretRef:
                    name: ai-collector-keys
                    optional: true
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  cpu: 500m
                  memory: 1Gi
              volumeMounts:
                - name: cache
                  mountPath: /tmp/gpu-collector-cache
          volumes:
            - name: cache
              emptyDir:
                sizeLimit: 5Gi
