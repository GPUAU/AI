[project]
name = "gpu-cost-agent"
version = "0.1.0"
description = "GPU AU 원가 에이전트 - IDC 청구서 엑셀을 원가 항목으로 매핑"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "openpyxl>=3.1",
  "pydantic>=2.7",
  "httpx>=0.27",
  "openai>=1.40",
  "langgraph>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
sqlite = ["langgraph-checkpoint-sqlite>=3"]  # CHECKPOINT_DB로 세션을 SQLite에 저장할 때

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
