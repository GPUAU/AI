[project]
name = "gpu-cost-agent"
version = "0.1.0"
description = "GPU AU 원가 에이전트 - IDC 청구서 엑셀을 원가 항목으로 매핑"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "openpyxl>=3.1",
  "pydantic>=2.7",
  "httpx>=0.27",
  "openai>=1.40",
  "langgraph>=1.2,<2",
  "pdfplumber>=0.11",  # 텍스트가 있는 PDF 청구서 (MIT)
  "langsmith>=0.3",  # 선택: LangSmith 추적 (가린 데이터만, app/tracing.py)
]

[project.optional-dependencies]
dev = ["pytest>=8", "reportlab>=4"]  # reportlab: 샘플 PDF 생성
ocr = ["rapidocr>=3", "onnxruntime>=1.18"]  # 스캔 PDF를 서버 안에서 읽는 OCR (Apache-2.0)
sqlite = ["langgraph-checkpoint-sqlite>=3"]  # CHECKPOINT_DB로 세션을 SQLite에 저장할 때

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
