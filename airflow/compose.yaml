# 로컬 Airflow (LocalExecutor: api-server · scheduler · dag-processor). 저장소 루트에서 실행한다.
#
#   docker compose up -d db                       # 루트 docker-compose.yml의 로컬 PostgreSQL(5435)
#   docker compose -f airflow/compose.yaml up -d --build
#   http://127.0.0.1:8088                         # 로컬은 로그인 없이 관리자
#
# - 수집 데이터는 gpu_erd, Airflow 메타는 같은 서버의 airflow DB · airflow 스키마(EKS의 RDS 구성과 같은 스키마 분리).
# - 키는 collector/.env를 그대로 읽는다. Slack 웹훅은 airflow/.env의 AIRFLOW_CONN_SLACK_DEFAULT(선택, 커밋 금지).
# - DAG는 처음에 일시정지 상태다. UI에서 켜거나 `airflow dags trigger`로 실행한다(로컬 gpu_erd에 실제로 적재된다).
name: gpuau-ai-airflow

x-airflow: &airflow
  image: gpu-collector-airflow:dev
  build:
    context: ..
    dockerfile: airflow/Dockerfile
  env_file:
    - path: ../collector/.env
      required: false
    - path: .env
      required: false
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql://postgres:postgres@host.docker.internal:5435/airflow?options=-csearch_path%3Dairflow
    AIRFLOW__DATABASE__SQL_ALCHEMY_SCHEMA: airflow
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://api-server:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: local-only-not-a-secret
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
    AIRFLOW__API__BASE_URL: http://127.0.0.1:8088
    DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:5435/gpu_erd
  volumes:
    - ./dags:/opt/airflow/dags:ro
  extra_hosts:
    - host.docker.internal:host-gateway

services:
  init:
    <<: *airflow
    entrypoint: /bin/bash
    command:
      - -c
      - >-
        python /opt/airflow/scripts/prepare_db.py --create-database &&
        airflow db migrate &&
        airflow pools set collector 3 "사업자 수집 동시 실행 수"
    restart: "no"

  api-server:
    <<: *airflow
    command: api-server
    ports:
      - "127.0.0.1:8088:8080"
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  scheduler:
    <<: *airflow
    command: scheduler
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  dag-processor:
    <<: *airflow
    command: dag-processor
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
